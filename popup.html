<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strava Auto Kudos</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #fc4c02;
        --accent-dark: #d53f00;
        --ink: #1f2933;
        --muted: #627184;
        --line: #dde3ea;
        --surface: #ffffff;
        --green: #2f8f55;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 316px;
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.4 Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .language-toggle {
        width: auto;
        min-width: 44px;
        min-height: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--ink);
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .language-toggle:hover {
        background: #f6f8fa;
      }

      .auto-mode-section {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: #fafbfc;
      }

      .auto-mode-section.active {
        border-color: var(--green);
        background: #f2faf5;
      }

      .auto-mode-label {
        font-weight: 700;
        font-size: 13px;
      }

      .auto-mode-desc {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }

      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        inset: 0;
        background: #cdd5de;
        border-radius: 24px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .toggle-slider::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      .toggle-switch input:checked + .toggle-slider {
        background: var(--green);
      }

      .toggle-switch input:checked + .toggle-slider::after {
        transform: translateX(20px);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 78px;
        gap: 8px;
      }

      button {
        width: 100%;
        min-height: 36px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        border: 1px solid #f2b8ae;
        background: #fff7f4;
        color: #b42318;
      }

      button.secondary:hover {
        background: #ffe8e1;
      }

      button:focus-visible {
        outline: 2px solid #111827;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .settings {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .settings legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .date-row {
        display: grid;
        grid-template-columns: 1.2fr 0.85fr 1fr;
        gap: 8px;
      }

      .single-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
      }

      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #111827;
        outline-offset: 2px;
      }

      #status {
        min-height: 34px;
        margin: 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .last-run {
        font-size: 11px;
        color: var(--muted);
        padding: 6px 0 0;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="title">Strava Kudos</h1>
        <div class="header-actions">
          <button id="languageButton" class="language-toggle" type="button" aria-label="Switch language">中文</button>
        </div>
      </header>

      <div id="autoModeSection" class="auto-mode-section">
        <div>
          <div class="auto-mode-label" data-i18n="autoModeLabel">Auto mode</div>
          <div class="auto-mode-desc" data-i18n="autoModeDesc">Automatically give kudos on schedule</div>
        </div>
        <label class="toggle-switch" aria-label="Toggle auto mode">
          <input id="autoModeToggle" type="checkbox">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <fieldset class="settings">
        <legend data-i18n="scheduleLegend">Schedule</legend>
        <div class="single-row">
          <label for="scheduleInterval">
            <span data-i18n="scheduleIntervalLabel">Check every (minutes)</span>
            <input id="scheduleInterval" type="number" min="5" max="1440" step="5" value="30" inputmode="numeric">
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="delayLegend">Kudos delay</legend>
        <div class="range-row">
          <label for="minDelayInput">
            <span data-i18n="minDelayLabel">Min sec</span>
            <input id="minDelayInput" type="number" min="0.8" max="120" step="0.1" value="1.7" inputmode="decimal">
          </label>
          <label for="maxDelayInput">
            <span data-i18n="maxDelayLabel">Max sec</span>
            <input id="maxDelayInput" type="number" min="0.8" max="120" step="0.1" value="4.6" inputmode="decimal">
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="dateLegend">Activity date</legend>
        <div class="date-row">
          <label for="dateRangeMode">
            <span data-i18n="dateFilterLabel">Filter</span>
            <select id="dateRangeMode">
              <option value="any" data-i18n="dateAnyOption">Any time</option>
              <option value="last" data-i18n="dateLastOption">Last</option>
            </select>
          </label>
          <label for="dateRangeValue">
            <span data-i18n="dateRangeLabel">Range</span>
            <input id="dateRangeValue" type="number" min="1" max="3650" step="1" value="7" inputmode="numeric">
          </label>
          <label for="dateRangeUnit">
            <span data-i18n="dateUnitLabel">Unit</span>
            <select id="dateRangeUnit">
              <option value="days" data-i18n="daysOption">days</option>
              <option value="months" data-i18n="monthsOption">months</option>
              <option value="years" data-i18n="yearsOption">years</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="relationshipLegend">Relationship</legend>
        <div class="single-row">
          <label for="relationshipFilterMode">
            <span data-i18n="relationshipFilterLabel">Filter</span>
            <select id="relationshipFilterMode">
              <option value="connected" data-i18n="relationshipConnectedOption">Following / follows me only</option>
              <option value="any" data-i18n="relationshipAnyOption">Any visible activity</option>
            </select>
          </label>
        </div>
      </fieldset>

      <div class="controls">
        <button id="runNowButton" type="button" data-i18n="runNowButton">Run now</button>
        <button id="stopButton" class="secondary" type="button" disabled data-i18n="stopButton">Stop</button>
      </div>

      <p id="status" role="status" aria-live="polite" data-i18n="readyStatus">Ready on Strava.</p>
      <div id="lastRun" class="last-run" style="display:none"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
