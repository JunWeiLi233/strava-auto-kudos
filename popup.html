<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strava Auto Kudos</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #fc4c02;
        --accent-dark: #c33b00;
        --ink: #171717;
        --muted: #697386;
        --line: #e3e6ea;
        --line-strong: #cfd5dc;
        --surface: #fbfaf8;
        --panel: #ffffff;
        --field: #f6f7f8;
        --green: #27794d;
        --green-soft: #edf7f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.35 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 14px;
        background:
          linear-gradient(135deg, rgba(252, 76, 2, 0.08), transparent 38%),
          var(--surface);
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 2px 2px 0;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: 0;
        line-height: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .language-toggle {
        min-width: 44px;
        min-height: 30px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 750;
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background 160ms;
      }

      .language-toggle:hover {
        background: #ffffff;
      }

      .language-toggle:active,
      button:active {
        transform: translateY(1px) scale(0.99);
      }

      .auto-mode-section {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 12px 28px -22px rgba(23, 23, 23, 0.55);
      }

      .auto-mode-section.active {
        border-color: var(--green);
        background: linear-gradient(135deg, var(--green-soft), #ffffff 62%);
      }

      .auto-mode-label {
        font-weight: 760;
        font-size: 14px;
      }

      .auto-mode-desc {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }

      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        inset: 0;
        background: #cdd5de;
        border-radius: 24px;
        cursor: pointer;
        transition: background 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .toggle-slider::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(23, 23, 23, 0.2);
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .toggle-switch input:checked + .toggle-slider {
        background: var(--green);
      }

      .toggle-switch input:checked + .toggle-slider::after {
        transform: translateX(20px);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 86px;
        gap: 8px;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 760;
        letter-spacing: 0;
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background 160ms, opacity 160ms;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        border: 1px solid #e8b2a3;
        background: #fff6f2;
        color: #a73711;
      }

      button.secondary:hover {
        background: #ffe8e1;
      }

      button:focus-visible {
        outline: 2px solid #111827;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .settings {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
      }

      .settings legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .date-row {
        display: grid;
        grid-template-columns: 1.2fr 0.85fr 1fr;
        gap: 8px;
      }

      .single-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 8px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
        transition: border-color 160ms, background 160ms, box-shadow 160ms;
      }

      input:focus-visible,
      select:focus-visible {
        outline: 2px solid rgba(252, 76, 2, 0.35);
        outline-offset: 2px;
        background: #ffffff;
      }

      #status {
        position: relative;
        min-height: 42px;
        margin: 0;
        padding: 10px 12px 10px 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
      }

      #status::before {
        content: "";
        position: absolute;
        top: 15px;
        left: 12px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(252, 76, 2, 0.12);
      }

      .last-run {
        font-size: 11px;
        color: var(--muted);
        padding: 0 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="title">Strava Kudos</h1>
        <div class="header-actions">
          <button id="languageButton" class="language-toggle" type="button" aria-label="Switch language">中文</button>
        </div>
      </header>

      <div id="autoModeSection" class="auto-mode-section">
        <div>
          <div class="auto-mode-label" data-i18n="autoModeLabel">Auto mode</div>
          <div class="auto-mode-desc" data-i18n="autoModeDesc">Automatically give kudos on schedule</div>
        </div>
        <label class="toggle-switch" aria-label="Toggle auto mode">
          <input id="autoModeToggle" type="checkbox">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <fieldset class="settings">
        <legend data-i18n="scheduleLegend">Schedule</legend>
        <div class="single-row">
          <label for="scheduleInterval">
            <span data-i18n="scheduleIntervalLabel">Check every (minutes)</span>
            <input id="scheduleInterval" type="number" min="5" max="1440" step="5" value="30" inputmode="numeric">
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="delayLegend">Kudos delay</legend>
        <div class="range-row">
          <label for="minDelayInput">
            <span data-i18n="minDelayLabel">Min sec</span>
            <input id="minDelayInput" type="number" min="0.8" max="120" step="0.1" value="1.7" inputmode="decimal">
          </label>
          <label for="maxDelayInput">
            <span data-i18n="maxDelayLabel">Max sec</span>
            <input id="maxDelayInput" type="number" min="0.8" max="120" step="0.1" value="4.6" inputmode="decimal">
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="dateLegend">Activity date</legend>
        <div class="date-row">
          <label for="dateRangeMode">
            <span data-i18n="dateFilterLabel">Filter</span>
            <select id="dateRangeMode">
              <option value="any" data-i18n="dateAnyOption">Any time</option>
              <option value="last" data-i18n="dateLastOption">Last</option>
            </select>
          </label>
          <label for="dateRangeValue">
            <span data-i18n="dateRangeLabel">Range</span>
            <input id="dateRangeValue" type="number" min="1" max="3650" step="1" value="7" inputmode="numeric">
          </label>
          <label for="dateRangeUnit">
            <span data-i18n="dateUnitLabel">Unit</span>
            <select id="dateRangeUnit">
              <option value="days" data-i18n="daysOption">days</option>
              <option value="months" data-i18n="monthsOption">months</option>
              <option value="years" data-i18n="yearsOption">years</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset class="settings">
        <legend data-i18n="relationshipLegend">Relationship</legend>
        <div class="single-row">
          <label for="relationshipFilterMode">
            <span data-i18n="relationshipFilterLabel">Filter</span>
            <select id="relationshipFilterMode">
              <option value="connected" data-i18n="relationshipConnectedOption">Following / follows me only</option>
              <option value="any" data-i18n="relationshipAnyOption">Any visible activity</option>
            </select>
          </label>
        </div>
      </fieldset>

      <div class="controls">
        <button id="runNowButton" type="button" data-i18n="runNowButton">Run now</button>
        <button id="stopButton" class="secondary" type="button" disabled data-i18n="stopButton">Stop</button>
      </div>

      <p id="status" role="status" aria-live="polite" data-i18n="readyStatus">Ready on Strava.</p>
      <div id="lastRun" class="last-run" style="display:none"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
